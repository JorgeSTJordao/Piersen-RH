<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piersen HR - Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<div class="login-card">
    <h1 class="brand">Piersen<span> HR</span></h1>
    <p class="subtitle">Plataforma de autoatendimento de RH e funcionarios</p>

    <form id="login-form">
        <div style="margin-bottom:14px">
            <label for="email">E-mail corporativo</label>
            <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div style="margin-bottom:20px">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="primary" style="width:100%">Entrar</button>
    </form>

    <div id="login-feedback" class="feedback"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
