trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)
  imageName: piersen-hr
  workingDirectory: backend

stages:
  - stage: Build
    displayName: Build e testes unitarios
    jobs:
      - job: BuildAndTest
        displayName: Compilar e testar a API
        steps:
          - task: Cache@2
            displayName: Cache das dependencias Maven
            inputs:
              key: 'maven | "$(Agent.OS)" | $(workingDirectory)/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)

          - task: Maven@4
            displayName: mvn clean verify
            inputs:
              mavenPomFile: $(workingDirectory)/pom.xml
              goals: clean verify
              options: -B
              publishJUnitResults: true
              testResultsFiles: '$(workingDirectory)/target/surefire-reports/TEST-*.xml'
              codeCoverageToolOption: JaCoCo
              javaHomeOption: JDKVersion
              jdkVersionOption: '1.17'
              mavenOptions: $(MAVEN_OPTS)

          - task: CopyFiles@2
            displayName: Copiar artefato
            inputs:
              contents: '$(workingDirectory)/target/*.jar'
              targetFolder: $(Build.ArtifactStagingDirectory)
              flattenFolders: true

          - task: PublishBuildArtifacts@1
            displayName: Publicar artefato
            inputs:
              pathToPublish: $(Build.ArtifactStagingDirectory)
              artifactName: piersen-hr-api

  - stage: Package
    displayName: Empacotar imagem Docker
    dependsOn: Build
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
    jobs:
      - job: DockerBuild
        displayName: Build da imagem
        steps:
          - task: Docker@2
            displayName: docker build
            inputs:
              command: build
              repository: $(imageName)
              dockerfile: $(workingDirectory)/Dockerfile
              buildContext: $(workingDirectory)
              tags: |
                $(Build.BuildId)
                latest
